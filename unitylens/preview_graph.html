<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnityLens — Unity C# 구조 · 변수 추적기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* UnityLens — instrument-room palette: graphite green, lens gold, read teal, write rust */
:root{
  --bg:#0a100e;
  --bg-2:#0c1411;
  --panel:#101a16;
  --panel-2:#14201b;
  --panel-3:#182620;
  --line:#21332a;
  --line-2:#2c4437;
  --ink:#e9efe5;
  --dim:#93a89a;
  --faint:#63796c;
  --gold:#d9a84e;
  --gold-soft:rgba(217,168,78,.13);
  --read:#5ec8ac;
  --read-soft:rgba(94,200,172,.12);
  --write:#ef7452;
  --write-soft:rgba(239,116,82,.12);
  --violet:#a99bf0;
  --violet-soft:rgba(169,155,240,.12);
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Code",Menlo,monospace;
  --sans:"IBM Plex Sans KR","IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --display:"Archivo","IBM Plex Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(217,168,78,.075), transparent 62%),
    radial-gradient(760px 480px at 96% 4%, rgba(94,200,172,.05), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(1200px 700px at 40% 0%,#000 20%,transparent 85%);
}
::selection{background:rgba(217,168,78,.28);color:#fff}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:500}
.dim{color:var(--dim)}
.faint{color:var(--faint)}

/* ---------- shell ---------- */
.app{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:296px minmax(0,1fr);
  grid-template-rows:68px minmax(0,1fr);
  height:100vh;height:100dvh;
}
.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:22px;
  padding:0 22px;border-bottom:1px solid var(--line);
  background:rgba(10,16,14,.82);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:236px}
.brand svg{display:block;flex:0 0 auto}
.brand h1{font-family:var(--display);font-size:17px;letter-spacing:.01em;font-weight:700}
.brand h1 span{color:var(--gold)}
.brand p{font-size:9px;letter-spacing:.19em;color:var(--faint);text-transform:uppercase;margin-top:1px}
.header-meta{display:flex;gap:20px;align-items:center;flex:1;min-width:0;overflow:hidden}
.hm{display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.hm b{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:500}
.hm span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.tools{display:flex;gap:8px;align-items:center}
.btn{
  border:1px solid var(--line-2);background:var(--panel-2);
  padding:8px 13px;border-radius:8px;font-size:12px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,transform .15s;
}
.btn:hover{background:var(--panel-3);border-color:#3a574610}
.btn:hover{border-color:#3a5746}
.btn.primary{background:var(--gold);color:#17130a;border-color:var(--gold);font-weight:600}
.btn.primary:hover{background:#e6b65e;border-color:#e6b65e}
.btn svg{width:13px;height:13px}

/* rail */
.rail{
  border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(16,26,22,.9),rgba(10,16,14,.65));
  display:flex;flex-direction:column;min-height:0;
}
.rail-top{padding:14px 14px 10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg-2);border-radius:8px;padding:0 10px;height:34px}
.search svg{width:13px;height:13px;color:var(--faint);flex:0 0 auto}
.search input{flex:1;background:none;border:none;outline:none;font-size:12.5px;color:var(--ink);min-width:0}
.search input::placeholder{color:#5b7064}
.rail-list{overflow:auto;padding:2px 10px 10px;flex:1;min-height:0;scrollbar-width:thin}
.rail-group{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:12px 6px 5px}
.ritem{
  width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;
  padding:9px 10px;border-radius:8px;border:1px solid transparent;position:relative;margin-bottom:2px;
}
.ritem:hover{background:rgba(255,255,255,.028)}
.ritem.on{background:linear-gradient(90deg,rgba(217,168,78,.13),rgba(217,168,78,.03));border-color:rgba(217,168,78,.28)}
.ritem.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:2px;background:var(--gold);border-radius:2px}
.ritem .rn{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .rb{font-size:9px;letter-spacing:.04em;color:var(--faint);white-space:nowrap}
.ritem .rr{grid-column:1/-1;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.ritem .rr .tick{width:4px;height:4px;border-radius:50%;background:var(--gold);flex:0 0 auto;opacity:.8}
.ritem .cnt{font-family:var(--mono);font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:auto}
.rail-foot{display:flex;align-items:center;gap:7px;padding:11px 16px;border-top:1px solid var(--line);font-size:10px;color:var(--faint)}
.rail-foot .dot{width:5px;height:5px;border-radius:50%;background:var(--read);box-shadow:0 0 8px var(--read)}

/* stage */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(10,16,14,.6);flex:0 0 auto;overflow:auto}
.tabs button{
  position:relative;padding:15px 14px 13px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);font-weight:500;white-space:nowrap;
}
.tabs button:hover{color:var(--dim)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--gold)}
.tabs .tcount{font-family:var(--mono);font-size:9px;margin-left:5px;color:var(--faint);border:1px solid var(--line);padding:0 3px;border-radius:3px;vertical-align:1px}
.views{flex:1;overflow:auto;min-height:0;position:relative;scrollbar-width:thin}
.view{display:none;padding:24px 26px 60px;max-width:1320px;animation:rise .28s ease both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* common blocks */
.card{background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 60%),var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;position:relative}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h3{font-size:12.5px;letter-spacing:.02em}
.card-h .eyebrow{color:var(--faint)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.grid2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--dim);background:rgba(255,255,255,.02);white-space:nowrap}
.chip.base{color:var(--violet);border-color:rgba(169,155,240,.3);background:var(--violet-soft)}
.chip.iface{color:var(--read);border-color:rgba(94,200,172,.28);background:var(--read-soft)}
.chip.attr{color:var(--gold);border-color:rgba(217,168,78,.28);background:var(--gold-soft)}
.chip.sev-high{color:#ff9a7d;border-color:rgba(239,116,82,.4);background:var(--write-soft)}
.chip.sev-medium{color:var(--gold);border-color:rgba(217,168,78,.35);background:var(--gold-soft)}
.chip.sev-low{color:var(--dim);border-color:var(--line-2);background:rgba(255,255,255,.02)}
.chip.serialized{color:var(--gold);border-color:rgba(217,168,78,.28)}
.chip.tone-data{color:var(--violet);border-color:rgba(169,155,240,.3);background:var(--violet-soft)}
.chip.tone-system{color:var(--read);border-color:rgba(94,200,172,.28);background:var(--read-soft)}
.chip.tone-action{color:var(--gold);border-color:rgba(217,168,78,.3);background:var(--gold-soft)}
.chip.tone-ui{color:#e2a1c7;border-color:rgba(226,161,199,.32);background:rgba(226,161,199,.1)}
.chip.tone-plain{color:var(--dim)}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--faint)}
.pill.read{color:var(--read);border-color:rgba(94,200,172,.3);background:var(--read-soft)}
.pill.write{color:var(--write);border-color:rgba(239,116,82,.32);background:var(--write-soft)}
.pill.readwrite{color:var(--gold);border-color:rgba(217,168,78,.32);background:var(--gold-soft)}
.pill.ext{color:var(--violet);border-color:rgba(169,155,240,.3);background:var(--violet-soft)}
.muted-line{font-size:12px;color:var(--dim);line-height:1.7}
.kv{display:flex;gap:10px;align-items:baseline;font-size:12px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);font-weight:500;font-size:11.5px}
.kv span{color:var(--faint);font-size:10.5px;min-width:52px;text-transform:uppercase;letter-spacing:.08em}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* overview hero */
.hero{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(120deg,rgba(217,168,78,.075),transparent 46%),linear-gradient(180deg,var(--panel-2),var(--panel));
  padding:26px 28px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:center;
}
.hero .rings{position:absolute;right:-70px;top:-110px;width:420px;height:420px;opacity:.5;pointer-events:none}
.hero .rings circle{fill:none;stroke:rgba(217,168,78,.22);stroke-width:1}
.hero .rings .beam{stroke:rgba(217,168,78,.5);stroke-width:1.5}
.hero h2{font-family:var(--display);font-size:clamp(26px,3vw,40px);line-height:1.12;letter-spacing:-.025em;font-weight:700;margin-bottom:8px}
.hero h2 em{font-style:normal;color:var(--gold)}
.hero .lede{font-size:13px;color:var(--dim);max-width:52ch;line-height:1.7}
.hero-num{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.hero-num .n{font-family:var(--display);font-size:66px;line-height:.86;font-weight:700;color:var(--ink);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero-num .u{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding-bottom:8px}
.hero-side{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.hstat{border:1px solid var(--line);background:rgba(10,16,14,.5);border-radius:9px;padding:10px 12px}
.hstat b{display:block;font-family:var(--display);font-size:23px;letter-spacing:-.02em;font-weight:600;line-height:1.1}
.hstat span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.hstat.gold b{color:var(--gold)}
.hstat.rust b{color:var(--write)}
.hstat.teal b{color:var(--read)}
.hstat.violet b{color:var(--violet)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-head h3{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);font-weight:500}
.section-head .hint{font-size:10.5px;color:var(--faint)}

/* bars */
.bar-row{display:grid;grid-template-columns:132px 1fr 34px;gap:10px;align-items:center;padding:6px 0}
.bar-row .lbl{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.bar-row .v{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-weight:500;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:0 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{cursor:default}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:rgba(217,168,78,.045)}
table.t td.name{font-family:var(--mono);color:var(--ink);white-space:nowrap}
table.t td.tiny{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:right;white-space:nowrap}
table.t td .ty{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
table.t td .muted{color:var(--faint);font-size:10.5px}
table.t .files{font-family:var(--mono);font-size:10px;color:var(--faint)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* issue list */
.issue{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.issue:last-child{border-bottom:0}
.issue .sev{width:3px;border-radius:2px;background:var(--faint)}
.issue.high .sev{background:var(--write)}
.issue.medium .sev{background:var(--gold)}
.issue.low .sev{background:var(--line-2)}
.issue h4{font-size:12px;font-weight:600;margin-bottom:2px}
.issue p{font-size:11px;color:var(--dim);line-height:1.55}
.issue .where{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:4px}
.issue .jump{color:var(--gold);cursor:pointer;text-decoration:none;border-bottom:1px dotted rgba(217,168,78,.4)}

/* class view */
.class-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.class-head .ttl{flex:1;min-width:260px}
.class-head h2{font-family:var(--display);font-size:32px;letter-spacing:-.03em;line-height:1.1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.class-head .sub{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}
.class-head .filetag{font-family:var(--mono);font-size:11px;color:var(--faint)}
.sig{font-family:var(--mono);font-size:12px;color:var(--dim);background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:10px;overflow:auto;white-space:nowrap}
.sig .kw{color:var(--violet)}
.sig .nm{color:var(--gold)}
.role-card{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.role-card:last-child{border-bottom:0;padding-bottom:0}
.role-card .rc-badge{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--gold-soft);border:1px solid rgba(217,168,78,.3);color:var(--gold);font-family:var(--mono);font-size:11px}
.role-card h4{font-size:12.5px;margin-bottom:3px}
.role-card ul{margin:0;padding-left:14px}
.role-card li{font-size:11.5px;color:var(--dim);line-height:1.6}

.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:linear-gradient(var(--gold),var(--line))}
.tl{position:relative;padding:0 0 14px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:-17px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gold)}
.tl h4{font-family:var(--mono);font-size:12px;font-weight:500;display:flex;gap:8px;align-items:center}
.tl .ln{font-size:9.5px;color:var(--faint)}
.tl p{font-size:11px;color:var(--dim);margin-top:2px}

.field-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.field-line:last-child{border-bottom:0}
.field-line .fl-name{font-family:var(--mono);font-size:12px;color:var(--ink);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.field-line .fl-ty{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:2px}
.field-line .fl-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rowlink{cursor:pointer}
.rowlink:hover .fl-name,.rowlink:hover .rn{color:var(--gold)}

/* vars */
.vars-wrap{display:grid;grid-template-columns:272px minmax(0,1fr);gap:16px;align-items:start}
.varlist{max-height:calc(100vh - 250px);overflow:auto;scrollbar-width:thin;padding-right:4px}
.vitem{width:100%;text-align:left;display:block;padding:9px 10px;border-radius:8px;border:1px solid transparent;margin-bottom:2px}
.vitem:hover{background:rgba(255,255,255,.028)}
.vitem.on{background:var(--gold-soft);border-color:rgba(217,168,78,.26)}
.vitem .vn{font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.vitem .vm{font-size:10px;color:var(--faint);display:flex;gap:6px;margin-top:1px}
.vitem .vt{font-family:var(--mono);font-size:9.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trace-decl{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.trace-decl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold)}
.trace-decl .td-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.trace-decl .td-name{font-family:var(--mono);font-size:16px;color:var(--gold)}
.trace-decl .td-type{font-family:var(--mono);font-size:11px;color:var(--dim)}
.trace-decl .td-line{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto}
.trace-decl .td-code{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px;white-space:pre-wrap;word-break:break-word}
.trace-stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.tstat{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:10px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.tstat b{font-family:var(--mono);font-size:13px;color:var(--ink);margin-left:5px;letter-spacing:0}
.tstat.read b{color:var(--read)}.tstat.write b{color:var(--write)}.tstat.ext b{color:var(--violet)}
.trace{position:relative;margin-top:6px}
.trace::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tr{position:relative;padding:0 0 12px 26px}
.tr .dot{position:absolute;left:3px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line-2)}
.tr.read .dot{border-color:var(--read)}
.tr.write .dot{border-color:var(--write)}
.tr.readwrite .dot{border-color:var(--gold)}
.tr.ext .dot{border-color:var(--violet);background:var(--violet-soft)}
.tr .tr-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.tr .tr-m{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.tr .tr-l{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-left:auto}
.tr .tr-c{font-family:var(--mono);font-size:11px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05);border-radius:5px;padding:5px 8px;white-space:pre-wrap;word-break:break-word}
.tr .tr-via{font-family:var(--mono);font-size:9.5px;color:var(--violet);margin-top:3px}
.empty{padding:30px;text-align:center;color:var(--faint);font-size:12px;border:1px dashed var(--line);border-radius:10px}

/* graph */
.graph-wrap{border:1px solid var(--line);border-radius:12px;background:radial-gradient(700px 380px at 50% 0%,rgba(217,168,78,.05),transparent 70%),var(--bg-2);overflow:auto;padding:8px}
.graph-wrap svg{display:block;min-width:720px}
.gnode{cursor:pointer}
.gnode rect{fill:var(--panel-2);stroke:var(--line-2);stroke-width:1;transition:fill .15s,stroke .15s}
.gnode:hover rect{fill:var(--panel-3);stroke:var(--gold)}
.gnode.on rect{stroke:var(--gold);stroke-width:1.5;fill:rgba(217,168,78,.1)}
.gnode text{fill:var(--ink);font-family:var(--mono);font-size:11px}
.gnode .gbase{fill:var(--faint);font-size:8.5px;font-family:var(--mono);letter-spacing:.04em}
.gedge{fill:none;stroke:#3f5f4e;stroke-width:1.2;transition:stroke .15s}
.gedge:hover{stroke:var(--gold);stroke-width:1.6}
.gedge.inherit{stroke:var(--violet);stroke-dasharray:4 3}
.gedge-label{fill:var(--faint);font-size:8px;font-family:var(--mono)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:10.5px;color:var(--faint)}
.legend i{display:inline-block;width:14px;height:2px;background:#3a5446;vertical-align:middle;margin-right:6px}
.legend .li{display:flex;align-items:center}
.legend .li.v i{background:var(--violet)}
.legend .li.g i{background:var(--gold)}

/* source */
.code-wrap{border:1px solid var(--line);border-radius:10px;background:#0a110e;overflow:auto;max-height:calc(100vh - 250px)}
.code{font-family:var(--mono);font-size:11.5px;line-height:1.72;min-width:max-content;padding:8px 0}
.cl{display:grid;grid-template-columns:52px 1fr;gap:0}
.cl .ln{color:#3f5348;text-align:right;padding-right:14px;user-select:none;font-size:10px;padding-top:1px}
.cl .cd{white-space:pre;color:#c9d6c9;padding-right:20px}
.cl.hit{background:rgba(217,168,78,.1)}
.cl.hit .ln{color:var(--gold)}
.cl.hit .cd{color:#f2e3c2}
.cl.hit.write{background:rgba(239,116,82,.09)}
.cl.hit.write .ln{color:var(--write)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,8,6,.7);backdrop-filter:blur(6px);padding:24px}
.modal[hidden]{display:none}
.modal .box{width:min(780px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:14px}
.modal .mb{padding:16px 18px;overflow:auto}
.modal textarea{width:100%;height:300px;background:#0a110e;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;line-height:1.6;resize:vertical;outline:none;color:var(--ink)}
.modal textarea:focus{border-color:var(--line-2)}
.modal .mf{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.modal .hint{font-size:10.5px;color:var(--faint)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fname{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:8px}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel-3);border:1px solid var(--line-2);border-left:2px solid var(--gold);color:var(--ink);font-size:12px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
.scanline{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(217,168,78,.5),transparent);animation:scan 7s linear infinite;top:0}
@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.7}90%{opacity:.7}100%{transform:translateY(560px);opacity:0}}

@media (max-width:1120px){
  .app{grid-template-columns:1fr;grid-template-rows:68px auto minmax(0,1fr)}
  .rail{grid-row:2;border-right:0;border-bottom:1px solid var(--line)}
  .rail-list{display:flex;overflow-x:auto;padding:4px 10px 10px;gap:4px}
  .rail-group{display:none}
  .ritem{min-width:210px;margin-bottom:0}
  .ritem.on::before{display:none}
  .rail-foot{display:none}
  .stage{grid-row:3}
  .header-meta{display:none}
  .vars-wrap{grid-template-columns:1fr}
  .varlist{max-height:220px}
  .grid2,.grid2b,.hero{grid-template-columns:1fr}
  .view{padding:18px 14px 50px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<script id="samples" type="application/json">{"sources": [{"name": "BulletMove.cs", "code": "using UnityEngine;\n\npublic class BulletMove : MonoBehaviour\n{\n    [SerializeField] private float speed = 10f;\n    [SerializeField] private float destroyTime;\n    // Start is called once before the first execution\n    //of Update after the MonoBehaviour is created\n    void Start()\n    {\n        Destroy(gameObject, destroyTime);\n    }\n\n    // Update is called once per frame\n    void Update()\n    {\n        transform.Translate(speed * Time.deltaTime * Vector3.up);//\n    }\n}"}, {"name": "HomingBullet.cs", "code": "\nusing UnityEngine;\n\npublic class HomingBullet : MonoBehaviour\n{\n    [SerializeField] private float speed = 5f;\n    [SerializeField] private float destroyTime = 5f;\n    [SerializeField] private Transform target;\n\n    void Start()\n    {\n        Destroy(gameObject, destroyTime);\n        FindNearestEnemy();\n    }\n\n    void Update()\n    {\n        // 타겟이 없거나 파괴되었으면 다시 탐색\n        if (target == null)\n        {\n            FindNearestEnemy();\n        }\n\n        // 타겟이 있으면 유도 이동, 없으면 위쪽으로 직진\n        if (target != null)\n        {\n            Vector2 direction = ((Vector2)target.position - (Vector2)transform.position).normalized;\n            transform.position += (Vector3)(direction * (speed * Time.deltaTime));\n        }\n        else\n        {\n            transform.Translate(speed * Time.deltaTime * Vector3.up);\n        }\n    }\n\n    private void FindNearestEnemy()\n    {\n        GameObject[] enemies = GameObject.FindGameObjectsWithTag(\"Enemy\");\n        if (enemies.Length == 0) return;\n\n        float shortestDistance = Mathf.Infinity;\n        Transform nearestEnemy = null;\n\n        foreach (GameObject enemy in enemies)\n        {\n            if (enemy == null) continue;\n\n            float distance = Vector2.Distance(transform.position, enemy.transform.position);\n\n            if (distance < shortestDistance)\n            {\n                shortestDistance = distance;\n                nearestEnemy = enemy.transform;\n            }\n        }\n\n        target = nearestEnemy;\n    }\n}\n"}, {"name": "Intro Button.cs", "code": "using DG.Tweening;\nusing UnityEngine;\nusing UnityEngine.EventSystems;\nusing UnityEngine.SceneManagement;\n\npublic class IntroButton : MonoBehaviour, IPointerEnterHandler, IPointerExitHandler\n{\n    [SerializeField] private GameObject EditScene;\n    private RectTransform rectTransform;\n    private float originalX;\n\n    void Start()\n    {\n        rectTransform = GetComponent<RectTransform>();\n        originalX = rectTransform.anchoredPosition.x;\n    }\n\n    public void OnPointerEnter(PointerEventData eventData)\n    {\n        // ���� �ִϸ��̼��� ������ ������ �ʰ�, ���� ���� ���� ������ �ڿ������� �� ��ǥ�� ����\n        rectTransform.DOComplete();\n        rectTransform.DOScale(Vector3.one * 1.2f, 0.2f);\n    }\n\n    public void OnPointerExit(PointerEventData eventData)\n    {\n        // ���������� ���ڱ� ������ �ʰ� �ڿ������� ���� �ڸ��� ���ư��� ����\n        rectTransform.DOComplete();\n        rectTransform.DOScale(Vector3.one * 1.0f, 0.2f);\n    }\n    public void EditSceneOn()\n    {\n        EditScene.SetActive(true);\n    }\n    public void EditSceneOff()\n    {\n        EditScene.SetActive(false);\n    }\n    public void StartScene()\n    {\n        LoadingSceneManager.LoadScene(\"1_SlectScene\");\n    }\n    public void ExitGame()\n    {\n        Application.Quit();\n#if UNITY_EDITOR\n        UnityEditor.EditorApplication.isPlaying = false;\n#endif\n    }\n}"}, {"name": "KeyInputManager.cs", "code": "using System;\nusing System.Collections;\nusing System.Collections.Generic;\nusing UnityEngine;\nusing UnityEngine.InputSystem;\n\npublic enum KeyAction\n{\n    Forward,    // 상 이동\n    Backward,   // 하 이동\n    Left,       // 좌 이동\n    Right,      // 우 이동\n    Focus,      // 저속 이동 및 히트박스 노출\n    Attack,     // 기본 공격\n    Ultimate    // 필살기 / 스펠카드\n}\n\npublic class KeyManager : MonoBehaviour\n{\n    private static KeyManager instance;\n    public static KeyManager Instance\n    {\n        get\n        {\n            if (instance == null)\n            {\n                instance = FindFirstObjectByType<KeyManager>();\n                if (instance == null)\n                {\n                    GameObject go = new GameObject(\"KeyManager\");\n                    instance = go.AddComponent<KeyManager>();\n                    DontDestroyOnLoad(go);\n                    instance.InitDefaultKeys();\n                }\n            }\n            return instance;\n        }\n    }\n\n    // KeyCode 대신 UnityEngine.InputSystem.Key 사용\n    public Dictionary<KeyAction, Key> keys = new Dictionary<KeyAction, Key>();\n\n    private void Awake()\n    {\n        if (instance == null)\n        {\n            instance = this;\n            DontDestroyOnLoad(gameObject);\n            if (keys.Count == 0)\n            {\n                InitDefaultKeys();\n            }\n        }\n        else if (instance != this)\n        {\n            Destroy(gameObject);\n        }\n    }\n\n    private void InitDefaultKeys()\n    {\n        keys[KeyAction.Forward] = Key.W;\n        keys[KeyAction.Left] = Key.A;\n        keys[KeyAction.Backward] = Key.S;\n        keys[KeyAction.Right] = Key.D;\n\n        keys[KeyAction.Focus] = Key.LeftShift;\n        keys[KeyAction.Attack] = Key.Z;\n        keys[KeyAction.Ultimate] = Key.X;\n    }\n\n    // 키 바인딩 변경 메서드\n    public void ChangeKey(KeyAction actionToRebind, Action<Key> onKeyRebound = null)\n    {\n        StartCoroutine(WaitForKeyPress(actionToRebind, onKeyRebound));\n    }\n\n    private IEnumerator WaitForKeyPress(KeyAction actionToRebind, Action<Key> onKeyRebound)\n    {\n        yield return null; // 프레임 지연 (이전 입력 누수 방지)\n\n        bool keyAssigned = false;\n\n        while (!keyAssigned)\n        {\n            var kb = Keyboard.current;\n            if (kb != null && kb.anyKey.wasPressedThisFrame)\n            {\n                // Key.None과 Key.IMESelected 등 특수 키 제외 감지\n                foreach (Key k in Enum.GetValues(typeof(Key)))\n                {\n                    if (k == Key.None) continue;\n\n                    if (kb[k].wasPressedThisFrame)\n                    {\n                        keys[actionToRebind] = k;\n                        keyAssigned = true;\n                        onKeyRebound?.Invoke(k);\n                        break;\n                    }\n                }\n            }\n            yield return null;\n        }\n    }\n}"}, {"name": "Loading Manager.cs", "code": "using System.Collections;\nusing UnityEngine;\nusing UnityEngine.UI;\nusing UnityEngine.SceneManagement;\nusing TMPro;\n\npublic class LoadingSceneManager : MonoBehaviour\n{\n    [Header(\"UI 연결\")]\n    [SerializeField] private Slider progressBar;       // 로딩바 Slider\n    [SerializeField] private TextMeshProUGUI progressText; // 퍼센트 표시 텍스트 (TMP)\n\n    [Header(\"설정\")]\n    [SerializeField] private float fadeOrMinDelay = 0.5f; // 너무 빨리 넘어가서 화면이 튀는 것을 방지하기 위한 최소 대기 시간\n\n    // 이동할 다음 씬의 이름을 저장하는 정적 변수\n    public static string nextSceneName;\n\n    /// <summary>\n    /// 다른 매니저에서 씬 전환을 호출할 때 사용하는 정적 메서드\n    /// </summary>\n    /// <param name=\"sceneName\">이동하고자 하는 씬 이름</param>\n    public static void LoadScene(string sceneName)\n    {\n        nextSceneName = sceneName;\n        SceneManager.LoadScene(\"0.5_Loading\"); // 로딩 전용 씬으로 우선 이동\n    }\n\n    private void Start()\n    {\n        if (string.IsNullOrEmpty(nextSceneName))\n        {\n            Debug.LogError(\"로드할 씬 이름이 지정되지 않았습니다!\");\n            return;\n        }\n\n        StartCoroutine(LoadSceneAsync());\n    }\n\n    private IEnumerator LoadSceneAsync()\n    {\n        // 1. 비동기로 씬 로딩 시작\n        AsyncOperation op = SceneManager.LoadSceneAsync(nextSceneName);\n\n        // 씬 로딩이 완료되어도 즉시 전환되지 않도록 설정 (연출 및 부드러운 전환용)\n        op.allowSceneActivation = false;\n\n        float timer = 0f;\n\n        while (!op.isDone)\n        {\n            yield return null;\n            timer += Time.deltaTime;\n\n            // op.progress는 0.0 ~ 0.9 사이의 값을 반환합니다 (0.9에서 로딩 완료)\n            if (op.progress < 0.9f)\n            {\n                // 실제 진행률을 UI 슬라이더에 반영\n                float progress = Mathf.Clamp01(op.progress / 0.9f);\n                if (progressBar != null) progressBar.value = progress;\n                if (progressText != null) progressText.text = $\"LOADING... {(progress * 100f):F0}%\";\n            }\n            else\n            {\n                // 실제 씬 로딩이 completed(90% 이상)된 상태\n                // 비동기 로딩이 너무 빨라도 최소 대기 시간을 채워 연출을 완성함\n                float progress = Mathf.Lerp(progressBar != null ? progressBar.value : 0f, 1f, timer / fadeOrMinDelay);\n\n                if (progressBar != null) progressBar.value = progress;\n                if (progressText != null) progressText.text = $\"LOADING... {(progress * 100f):F0}%\";\n\n                // 게이지가 완전히 채워지면 씬 전환 허용\n                if (progressBar != null && progressBar.value >= 0.99f && timer >= fadeOrMinDelay)\n                {\n                    op\n\n\n                        .allowSceneActivation = true;\n                }\n            }\n        }\n    }\n}"}, {"name": "Player.cs", "code": "using UnityEngine;\n\n[CreateAssetMenu(fileName = \"PlayerData\", menuName = \"OverTheHorizon/Player\", order = 1)]\npublic class PlayerData : ScriptableObject\n{\n    // 데이터로 사용할 변수들 선언\n    public string playerName;\n    public int playerID;\n    public int playerHealth;\n    public float playerSpeed;\n    public GameObject chddkf;\n    public Sprite playerIcon;\n    public Sprite[] playerAnimation;\n    [TextArea] public string playerDescription;\n}"}, {"name": "PlayerMove.cs", "code": "using UnityEngine;\nusing UnityEngine.InputSystem;\n\npublic class PlayerMove: MonoBehaviour\n{\n    private float speed = 0f;\n\n    private Camera mainCamera;\n\n    private void Start()\n    {\n        // SelectScene에서 선택한 데이터가 있는지 확인 후 적용\n        if (SelectScene.SelectedData != null)\n        {\n            // 1. 속도 적용\n            speed = SelectScene.SelectedData.playerSpeed*5;\n\n\n            SpriteRenderer spriteRenderer = GetComponent<SpriteRenderer>();\n            if (spriteRenderer != null && SelectScene.SelectedData.playerIcon != null)\n            {\n                spriteRenderer.sprite = SelectScene.SelectedData.playerIcon;\n            }\n        }\n        else\n        {\n            Debug.LogWarning(\"선택된 캐릭터 데이터가 없습니다. 기본값으로 실행합니다.\");\n        }\n        mainCamera = Camera.main;\n    }\n\n    private void Update()\n    {\n        Vector2 dir = ReadMove();\n\n        if (dir.sqrMagnitude > 1f) dir.Normalize();\n        transform.Translate(dir * (speed * Time.deltaTime));\n\n        ClampToBounds();\n    }\n\n    private void ClampToBounds()\n    {\n        if (mainCamera == null) return;\n\n        Vector3 viewPos = mainCamera.WorldToViewportPoint(transform.position);\n\n        viewPos.x = Mathf.Clamp01(viewPos.x);\n        viewPos.y = Mathf.Clamp01(viewPos.y);\n\n        transform.position = mainCamera.ViewportToWorldPoint(viewPos);\n    }\n\n    private static Vector2 ReadMove()\n    {\n        var dir = Vector2.zero;\n\n        // 1) 키보드 입력 처리\n        var kb = Keyboard.current;\n        if (kb != null)\n        {\n            Key rightKey = Key.D, leftKey = Key.A, forwardKey = Key.W, backwardKey = Key.S;\n\n            if (KeyManager.Instance != null && KeyManager.Instance.keys != null)\n            {\n                KeyManager.Instance.keys.TryGetValue(KeyAction.Right, out rightKey);\n                KeyManager.Instance.keys.TryGetValue(KeyAction.Left, out leftKey);\n                KeyManager.Instance.keys.TryGetValue(KeyAction.Forward, out forwardKey);\n                KeyManager.Instance.keys.TryGetValue(KeyAction.Backward, out backwardKey);\n            }\n\n            if (kb[rightKey].isPressed) dir.x += 1f;\n             const name = toks[nameIdx] ? toks[nameIdx].v : '?';
            const close = bodyEnd(sep);
            const prop = {
              name, modifiers: mods, attrs, attrsRaw: attrsRaw.trim(),
              type: toks.slice(declStart, nameIdx).map(t => t.v).join(' ').replace(/ ?([<>\[\],.]) ?/g, '$1'),
              line: toks[nameIdx].line, endLine: toks[close] ? toks[close].line : toks[nameIdx].line,
              bodyStart: sep, bodyEnd: close, usages: []
            };
            ty.props.push(prop);
            k = close + 1;
            continue;
          }

          // field (possibly multiple declarators)
          let nameIdx = sep - 1;
          while (nameIdx > declStart && toks[nameIdx].t !== 'id') nameIdx--;
          if (!toks[nameIdx] || toks[nameIdx].t !== 'id') { k = sep + 1; continue; }
          const typeText = toks.slice(declStart, nameIdx).map(t => t.v).join(' ').replace(/ ?([<>\[\],.]) ?/g, '$1');
          const isSerialized = attrs.indexOf('SerializeField') >= 0 || attrs.indexOf('SerializeReference') >= 0 || (mods.indexOf('public') >= 0 && mods.indexOf('static') < 0 && mods.indexOf('const') < 0);
          let p2 = sep, curNameIdx = nameIdx;
          for (let dg = 0; dg < 60; dg++) {
            let init = '';
            if (toks[p2] && toks[p2].v === '=') {
              let e = p2 + 1, dd = 0;
              for (; e < be; e++) {
                const v = toks[e].v;
                const prevT = toks[e - 1];
                if (v === '(' || v === '[' || v === '{') dd++;
                else if (v === ')' || v === ']' || v === '}') dd--;
                else if (v === '<' && prevT && prevT.t === 'id' && /^[A-Z]/.test(prevT.v)) dd++;
                else if (v === '>' && dd > 0) dd--;
                else if (dd === 0 && (v === ';' || v === ',')) break;
              }
              init = toks.slice(p2 + 1, e).map(t => t.v).join(' ');
              p2 = e;
            }
            ty.fields.push({
              name: toks[curNameIdx].v, type: typeText, modifiers: mods, attrs, attrsRaw: attrsRaw.trim(),
              init, line: toks[curNameIdx].line, isSerialized,
              isPublic: mods.indexOf('public') >= 0, isStatic: mods.indexOf('static') >= 0,
              isConst: mods.indexOf('const') >= 0, usages: []
            });
            if (toks[p2] && toks[p2].v === ',') {
              p2++;
              let nx = p2;
              while (nx < be && toks[nx].t !== 'id') nx++;
              if (nx >= be) break;
              curNameIdx = nx; p2 = nx + 1;
              if (toks[p2] && toks[p2].v === ';') { ty.fields.push({ name: toks[nx].v, type: typeText, modifiers: mods, attrs, attrsRaw: attrsRaw.trim(), init: '', line: toks[nx].line, isSerialized, isPublic: mods.indexOf('public') >= 0, isStatic: mods.indexOf('static') >= 0, isConst: mods.indexOf('const') >= 0, usages: [] }); break; }
              continue;
            }
            break;
          }
          k = (toks[p2] && toks[p2].v === ';') ? p2 + 1 : p2;
        }
      }

      function findLocals(s, e) {
        const out = [];
        for (let k = s; k < e; k++) {
          const t = toks[k];
          if (t.t !== 'id') continue;
          const okType = t.v === 'var' || /^[A-Z]/.test(t.v);
          if (!okType) continue;
          let j = k + 1;
          if (toks[j] && toks[j].v === '[') { while (j < e && toks[j].v !== ']') j++; j++; }
          const nt = toks[j];
          if (!nt || nt.t !== 'id' || KEYWORDS.has(nt.v)) continue;
          const after = toks[j + 1];
          if (!after || ['=', ';', ',', ':', 'in'].indexOf(after.v) < 0) continue;
          const prev = toks[k - 1];
          if (!prev || ['.', 'new', 'return', 'out', 'ref', 'case', 'using', 'typeof', 'is', 'as'].indexOf(prev.v) >= 0) continue;
          out.push({ name: nt.v, type: t.v, line: nt.line, idx: j });
        }
        return out;
      }

      function parseParams(s, e) {
        const out = [];
        let cur = [], depth = 0;
        const flush = () => {
          if (!cur.length) return;
          let nameIdx = -1;
          for (let q = cur.length - 1; q >= 0; q--) if (cur[q].t === 'id' && !KEYWORDS.has(cur[q].v) && cur[q].v !== 'out' && cur[q].v !== 'ref') { nameIdx = q; break; }
          if (nameIdx >= 0) {
            const nm = cur[nameIdx];
            out.push({ name: nm.v, type: cur.slice(0, nameIdx).map(x => x.v).join(' ').replace(/ ?([<>\[\],.]) ?/g, '$1'), line: nm.line });
          }
          cur = [];
        };
        for (let q = s; q < e; q++) {
          const v = toks[q].v;
          if (v === '<' || v === '(' || v === '[') depth++;
          else if (v === '>' || v === ')' || v === ']') depth--;
          if (v === ',' && depth === 0) flush();
          else cur.push(toks[q]);
        }
        flush();
        return out;
      }
    });

    /* ---- global member index for cross-file traces ---- */
    const memberIndex = new Map();
    const indexMember = (ty, m, kind) => {
      if (!memberIndex.has(m.name)) memberIndex.set(m.name, []);
      memberIndex.get(m.name).push({ owner: ty, member: m, kind });
    };
    types.forEach(ty => {
      ty.fields.forEach(f => indexMember(ty, f, 'field'));
      ty.props.forEach(p => indexMember(ty, p, 'property'));
      ty.methods.forEach(m => indexMember(ty, m, 'method'));
    });

    /* ---- usage analysis ---- */
    types.forEach(ty => {
      ty.methods.forEach(m => {
        if (m.bodyStart < 0) return;
        const toks = ty.fileObj ? lexWithCache(ty.fileObj) : null;
        // handled in second pass below
      });
    });

    function lexWithCache(file) {
      if (!file._toks) file._toks = lex(file.code);
      return file._toks;
    }

    types.forEach(ty => {
      const toks = lexWithCache(ty.fileObj);
      const fieldMap = new Map();
      ty.fields.forEach(f => fieldMap.set(f.name, { kind: 'field', ref: f }));
      ty.props.forEach(p => fieldMap.set(p.name, { kind: 'property', ref: p }));
      const localDeclIdx = new Set();

      ty.methods.forEach(m => {
        if (m.bodyStart < 0) return;
        const scopes = new Map(fieldMap);
        m.params.forEach(p => scopes.set(p.name, { kind: 'param', ref: p }));
        m.locals.forEach(l => { scopes.set(l.name, { kind: 'local', ref: l }); localDeclIdx.add(l.idx); });

        for (let k = m.bodyStart; k <= m.bodyEnd; k++) {
          const t = toks[k];
          if (!t || t.t !== 'id') continue;
          const sym = scopes.get(t.v);
          if (!sym) continue;
          if (localDeclIdx.has(k)) continue;
          const prev = toks[k - 1], prev2 = toks[k - 2], next = toks[k + 1];
          if (prev && prev.v === '.' && !(prev2 && prev2.v === 'this')) continue;
          if (prev && (prev.v === 'nameof' || prev.v === 'typeof')) continue;
          let rw = 'read';
          if (next && ASSIGN_OPS.has(next.v)) rw = next.v === '=' ? 'write' : 'readwrite';
          else if (next && (next.v === '++' || next.v === '--')) rw = 'readwrite';
          else if (prev && (prev.v === '++' || prev.v === '--')) rw = 'readwrite';
          else if (prev && prev.v === 'out') rw = 'write';
          const codeLine = ty.fileObj.lines[t.line - 1] || '';
          const rec = {
            line: t.line, method: m.name, rw, code: codeLine.trim(),
            file: ty.fileObj.name, owner: ty.name, external: false
          };
          if (sym.kind === 'field' || sym.kind === 'property') {
            sym.ref.usages.push(rec);
            if (!m.usages.some(u => u.member === sym.ref.name && u.line === t.line && u.rw === rw)) {
              m.usages.push({ member: sym.ref.name, kind: sym.kind, line: t.line, rw, code: rec.code });
            }
          }
        }

        // external chains: A.B.C -> last known member in another type
        for (let k = m.bodyStart; k <= m.bodyEnd; k++) {
          const t = toks[k];
          if (!t || t.t !== 'id') continue;
          const prev = toks[k - 1];
          if (prev && prev.v === '.') continue;
          if (KEYWORDS.has(t.v)) continue;
          const chain = [t.v];
          let q = k;
          while (toks[q + 1] && toks[q + 1].v === '.' && toks[q + 2] && toks[q + 2].t === 'id') {
            chain.push(toks[q + 2].v); q += 2;
          }
          if (chain.length < 2) { k = q; continue; }
          if (chain[0] === 'this') continue;
          let hit = null, segIdx = -1;
          for (let ci = chain.length - 1; ci >= 1; ci--) {
            const cands = memberIndex.get(chain[ci]);
            if (!cands) continue;
            const ext = cands.filter(c => c.owner.name !== ty.name);
            if (ext.length) { hit = ext[0]; segIdx = ci; break; }
          }
          if (!hit) { k = q; continue; }
          const via = chain.slice(0, segIdx + 1).join('.');
          const next = toks[q + 1];
          let rw = 'read';
          if (next && ASSIGN_OPS.has(next.v)) rw = next.v === '=' ? 'write' : 'readwrite';
          const codeLine = ty.fileObj.lines[t.line - 1] || '';
          hit.member.usages.push({
            line: t.line, method: m.name, rw, code: codeLine.trim(), file: ty.fileObj.name,
            owner: ty.name, external: true, via
          });
          const rec = { target: hit.owner.name, member: hit.member.name, kind: hit.kind, via, line: t.line, method: m.name, rw };
          if (!ty.externals.some(e => e.target === rec.target && e.member === rec.member && e.line === rec.line && e.method === rec.method)) ty.externals.push(rec);
          m.external.push(rec);
          k = q;
        }
      });
    });

    /* ---- roles, issues, narrative ---- */
    types.forEach(ty => {
      ty.roles = classify(ty);
      ty.issues = detectIssues(ty, types, byName);
      ty.narrative = buildNarrative(ty);
      ty.stats = {
        fields: ty.fields.length, serialized: ty.fields.filter(f => f.isSerialized).length,
        methods: ty.methods.length, props: ty.props.length,
        reads: ty.fields.reduce((a, f) => a + f.usages.filter(u => u.rw !== 'write').length, 0),
        writes: ty.fields.reduce((a, f) => a + f.usages.filter(u => u.rw !== 'read').length, 0)
      };
    });

    const edges = [];
    types.forEach(ty => {
      const seen = new Set();
      ty.externals.forEach(e => {
        const key = ty.name + '>' + e.target;
        if (seen.has(key)) return;
        seen.add(key);
        edges.push({ from: ty.name, to: e.target, label: e.via, count: ty.externals.filter(x => x.target === e.target).length });
      });
      if (ty.base && byName.has(ty.base)) edges.push({ from: ty.name, to: ty.base, label: '상속', inherit: true });
    });

    return { files, types, byName, edges, unresolved: findUnresolved(types, byName) };
  }

  /* ---------------- roles ---------------- */
  function classify(ty) {
    const roles = [];
    const names = ty.methods.map(m => m.name);
    const has = n => names.indexOf(n) >= 0;
    const field = n => ty.fields.find(f => f.name === n);
    const add = (name, tone, evidence, score) => roles.push({ name, tone, evidence, score: score == null ? 50 : score });

    if (ty.kind === 'enum') {
      add('열거형 상수', 'data', ['키/상태 값을 이름으로 묶은 enum (' + ty.enumNames.length + '개 항목)'], 95);
      return roles.sort((a, b) => b.score - a.score);
    }
    if (ty.base === 'ScriptableObject') {
      const ev = ['ScriptableObject를 상속 → 씬에 붙지 않는 데이터 에셋'];
      if (/CreateAssetMenu/.test(ty.attrsRaw)) ev.push('CreateAssetMenu로 Project 창에서 .asset 생성 가능');
      add('데이터 에셋', 'data', ev, 95);
      if (ty.fields.every(f => !f.isSerialized)) add('빈 데이터 컨테이너', 'data', ['직렬화된 필드가 없음'], 30);
      return roles;
    }
    if (ty.base === 'MonoBehaviour' || ty.base === 'Behaviour' || ty.base === 'Component' || ty.base) {
      const isSingleton = ty.props.some(p => p.name === 'Instance') || ty.fields.some(f => f.name === 'instance');
      if (isSingleton && /Manager/i.test(ty.name)) add('싱글턴 매니저', 'system', ['정적 Instance 프로퍼티로 전역 접근점 제공', ty.modifiers.indexOf('static') >= 0 ? 'static 클래스' : 'DontDestroyOnLoad로 씬 전환에도 유지'], 92);
      else if (isSingleton) add('싱글턴', 'system', ['정적 Instance 접근점 보유'], 75);
      if (ty.interfaces.length && ty.interfaces.some(i => /Pointer|Drag|Submit|Select/.test(i))) add('UI 이벤트 핸들러', 'ui', ['EventSystem 인터페이스 구현: ' + ty.interfaces.join(', '), 'OnPointerEnter/Exit에서 시각 반응 처리'], 90);
      if (ty.methods.some(m => /Instantiate/.test(m.usages.map(u => u.code).join('')))) add('스폰/발사 컨트롤러', 'action', ['Instantiate로 프리팹을 런타임 생성', field('fireRate') ? 'fireRate로 연사 간격 제어' : '발사 위치/프리팹을 직렬화 필드로 주입'], 88);
      if (ty.methods.some(m => /Destroy\s*\(\s*gameObject/.test(m.usages.map(u => u.code).join('')))) add('수명 관리', 'action', ['Destroy(gameObject, t)로 오브젝트 수명 예약'], 80);
      if (ty.methods.some(m => /transform\s*\.\s*(Translate|position)/.test(m.usages.map(u => u.code).join('')))) add('이동 제어', 'action', ['Update에서 transform을 직접 갱신 (프레임 독립: Time.deltaTime)'], 85);
      if (ty.methods.some(m => /Keyboard|Gamepad|Key\./.test(m.usages.map(u => u.code).join('')))) add('입력 처리', 'system', ['Input System(Keyboard/Gamepad)에서 입력을 읽어 이동/공격으로 변환'], 84);
      if (ty.methods.some(m => /FindGameObjectsWithTag|FindFirstObjectByType|FindObjectOfType/.test(m.usages.map(u => u.code).join('')))) add('대상 탐색', 'system', ['태그/타입으로 씬 오브젝트를 검색해 참조 획득'], 78);
      if (ty.methods.some(m => /LoadSceneAsync|SceneManager/.test(m.usages.map(u => u.code).join('')))) add('씬 전환/로딩 연출', 'system', ['SceneManager로 비동기 로드', '진행률을 UI에 반영'], 90);
      if (ty.methods.some(m => /TextMeshProUGUI|TMP_Text|\.text\s*=/.test(m.usages.map(u => u.code).join('')))) add('UI 텍스트 표시', 'ui', ['TMP 컴포넌트의 text를 코드에서 갱신'], 76);
      if (ty.methods.some(m => /ClampToBounds|WorldToViewportPoint/.test(m.usages.map(u => u.code).join(''))) || ty.methods.some(m => m.name === 'ClampToBounds')) add('화면 경계 제한', 'action', ['카메라 뷰포트 좌표로 위치를 Clamp'], 70);
      if (!roles.length) add('MonoBehaviour 컴포넌트', 'system', (ty.base ? ty.base + '를 상속' : 'Unity 컴포넌트'), 55);
      return roles.sort((a, b) => b.score - a.score);
    }
    add(ty.kind === 'interface' ? '인터페이스' : '일반 C# 클래스', 'plain', ['Unity 타입을 상속하지 않는 순수 C# 타입'], 60);
    return roles;
  }

  /* ---------------- issues ---------------- */
  function detectIssues(ty, types, byName) {
    const out = [];
    const add = (sev, title, detail, evidence) => out.push({ sev, title, detail, evidence: evidence || '' });
    const codeOf = m => m.usages.map(u => u.code).join('\n');

    const baseName = (ty.file || '').replace(/\.cs$/i, '');
    const isComponent = ty.base === 'MonoBehaviour' || (ty.base && byName.has(ty.base)) || ty.interfaces.some(i => /Handler$/.test(i));
    if (ty.kind === 'class' && isComponent && baseName && baseName !== ty.name) {
      add('high', '파일명 ≠ 클래스명', 'Unity는 MonoBehaviour의 파일명과 클래스명이 같아야 Inspector에서 컴포넌트로 붙일 수 있습니다. "' + ty.name + '.cs"로 바꾸세요.', baseName + '.cs ↔ ' + ty.name);
    }
    ty.fields.forEach(f => {
      const reads = f.usages.filter(u => u.rw !== 'write').length;
      const writes = f.usages.filter(u => u.rw !== 'read').length;
      if (!f.isSerialized && reads === 0 && writes > 0) {
        add('medium', '쓰기만 하는 필드: ' + f.name, '값을 저장하지만 어디에서도 읽지 않습니다. 죽은 코드이거나 로직 누락입니다.', 'L' + f.line + ' · write ' + writes + ' / read 0');
      }
      if (f.isSerialized && f.usages.length === 0 && f.attrs.indexOf('SerializeField') >= 0) {
        // serialized but never touched in code: inspector-only is normal, only flag if suspicious name
      }
      if (/^(chddkf|temp|test|asdf|qwer)/i.test(f.name)) {
        add('low', '의미를 알 수 없는 필드명: ' + f.name, '오타이거나 실험용 필드로 보입니다. 이름을 의도에 맞게 바꾸세요.', 'L' + f.line + ' · ' + f.type);
      }
    });
    ty.methods.forEach(m => {
      const codes = codeOf(m);
      if (m.name === 'Update' || m.name === 'FixedUpdate' || m.name === 'LateUpdate') {
        if (/FindGameObjectsWithTag|FindFirstObjectByType|FindObjectOfType|GetComponent</.test(codes)) {
          add('high', m.name + ' 안에서 매 프레임 탐색', 'Find*/GetComponent를 프레임마다 호출하면 비용이 큽니다. 결과를 캐시하거나 재탐색 간격을 두세요.', 'L' + m.line + ' · ' + m.name);
        }
        if (/Camera\.main/.test(codes)) {
          add('low', m.name + '에서 Camera.main 접근', 'Camera.main은 내부적으로 FindGameObjectsWithTag를 수행합니다. Start에서 캐시하세요.', 'L' + m.line);
        }
      }
      if (m.name === 'Start' && /GetComponent</.test(codes) && !/if\s*\(\s*\w+\.?.*!= null/.test(codes)) {
        const gm = codes.match(/GetComponent<([^>]+)>/);
        add('medium', 'GetComponent 결과 null 미검사', '컴포넌트가 없으면 다음 줄에서 NullReferenceException이 발생합니다.' + (gm ? ' (' + gm[1] + ')' : ''), 'L' + m.line + ' · Start');
      }
      if (/Random\.Range\(0,\s*\w+\.Length\)/.test(codes)) {
        add('medium', '빈 배열 인덱스 위험', '배열이 비어 있으면 Random.Range(0,0)=0 → [0] 접근에서 IndexOutOfRangeException. Length 검사를 추가하세요.', 'L' + m.line);
      }
    });
    if (ty.fields.some(f => f.isStatic) || ty.props.some(p => /static/.test(p.modifiers.join(' ')))) {
      const st = ty.fields.find(f => f.isStatic);
      add('low', '정적 상태 유지', 'static 필드는 씬을 넘어 값이 남습니다. 씬 재진입 시 초기화 시점을 명시하세요.', st ? 'L' + st.line + ' · static ' + st.name : 'static 멤버');
    }
    if (/CreateAssetMenu/.test(ty.attrsRaw)) {
      const fn = (ty.attrsRaw.match(/fileName\s*=\s*"([^"]+)"/) || [])[1];
      if (fn) {
        const dup = types.filter(t => t !== ty && (t.attrsRaw.match(/fileName\s*=\s*"([^"]+)"/) || [])[1] === fn);
        if (dup.length) add('medium', 'CreateAssetMenu fileName 중복', '"' + fn + '" 이름이 ' + dup.map(d => d.name).join(', ') + '와 겹칩니다. 에셋 생성 시 파일명이 충돌합니다.', ty.name + ' ↔ ' + dup.map(d => d.name).join(', '));
      }
    }
    return out;
  }

  /* ---------------- narrative ---------------- */
  function buildNarrative(ty) {
    const out = [];
    const role = ty.roles[0] ? ty.roles[0].name : '타입';
    const base = ty.base ? ty.base + '를 상속' : '베이스 타입 없음';
    out.push('`' + ty.name + '`은(는) ' + base + (ty.interfaces.length ? ', ' + ty.interfaces.join('·') + ' 구현' : '') + '한 **' + role + '**입니다.');
    const life = ty.methods.filter(m => m.isLifecycle);
    if (life.length) {
      out.push('생명주기: ' + life.map(m => '`' + m.name + '`').join(' → ') + ' 순서로 호출됩니다.');
    }
    const used = ty.fields.filter(f => f.usages.length);
    const unused = ty.fields.filter(f => !f.usages.length && f.attrs.indexOf('SerializeField') < 0 && !f.isPublic);
    if (used.length) {
      out.push('추적된 필드 ' + used.length + '개 — ' + used.slice(0, 4).map(f => '`' + f.name + '`(' + f.usages.length + '회)').join(', ') + '.');
    }
    if (unused.length) out.push('코드에서 전혀 쓰이지 않는 필드: ' + unused.map(f => '`' + f.name + '`').join(', ') + '.');
    return out;
  }

  function findUnresolved(types, byName) {
    const out = [];
    const seen = new Set();
    types.forEach(ty => {
      const toks = lexWithCache(ty.fileObj);
      ty.methods.forEach(m => {
        if (m.bodyStart < 0) return;
        for (let k = m.bodyStart; k <= m.bodyEnd; k++) {
          const t = toks[k];
          if (!t || t.t !== 'id' || !/^[A-Z]/.test(t.v)) continue;
          const next = toks[k + 1];
          if (!next || next.v !== '.') continue;
          const prev = toks[k - 1];
          if (prev && (prev.v === '.' || prev.v === 'new' || prev.v === ':')) continue;
          if (byName.has(t.v) || KNOWN_TYPES.has(t.v)) continue;
          const localNames = ty.fields.map(f=>f.name).concat(ty.props.map(p=>p.name));
          if (localNames.indexOf(t.v) >= 0) continue;
          if (seen.has(t.v)) continue;
          seen.add(t.v);
          out.push({ name: t.v, usedBy: ty.name, line: t.line, method: m.name });
        }
      });
    });
    return out;
  }

  function lexWithCache(file) {
    if (!file._toks) file._toks = lex(file.code);
    return file._toks;
  }

  const api = { analyzeSources, lex, classify };
  root.UnityLensCore = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function () {

  const CORE = window.UnityLensCore;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TONE_KO = { data: '데이터', system: '시스템', action: '액션', ui: 'UI', plain: '일반' };

  const NOTES = {

    HomingBullet: '매 프레임 `target`을 검사해 없으면 `FindNearestEnemy()`로 **"Enemy" 태그 전체를 다시 검색**합니다. 타겟이 있으면 정규화한 방향을 `transform.position`에 직접 더하고(관성 없음), 없으면 위로 직진합니다. 구조는 단순하지만 적이 없을 때 `Update`마다 `FindGameObjectsWithTag`가 호출되어 GC·CPU 부담이 커집니다. 재탐색 쿨다운(0.2초)이나 적 등록 리스트로 바꾸는 편이 좋습니다. `target`이 파괴되면 Unity의 fake-null 덕분에 `target == null`이 참이 되어 재탐색으로 이어집니다.',
    IntroButton: 'EventTrigger 없이 `IPointerEnterHandler`/`IPointerExitHandler`를 직접 구현한 버튼입니다. DOTween으로 1.2배 ↔ 1.0배 스케일 트윈을 걸고, `DOComplete()`로 이전 트윈을 즉시 끝내 중첩을 막습니다. `originalX`에 시작 X 좌표를 저장하지만 **이후 읽는 곳이 없어 죽은 코드**입니다. `EditScene` 토글, `LoadingSceneManager.LoadScene("1_SlectScene")` 씬 이동, `Application.Quit()` + 에디터에서는 `isPlaying = false`로 재생 정지까지 처리합니다.',
    KeyManager: 'Input System의 `Key` 열거형으로 **리바인딩 가능한 키맵**을 만드는 싱글턴입니다. 정적 `Instance` 프로퍼티가 없으면 `FindFirstObjectByType`으로 찾고, 그래도 없으면 `KeyManager` 오브젝트를 만들어 `DontDestroyOnLoad`로 유지합니다. `Awake`에서는 중복 인스턴스를 파괴합니다. `ChangeKey`는 코루틴을 띄워 `anyKey.wasPressedThisFrame`을 기다린 뒤 `Enum.GetValues(typeof(Key))`를 순회해 눌린 키를 찾아 `keys`에 덮어쓰고 콜백을 호출합니다. `keys`가 public이라 `PlayerMove`/`PlayerShooting`이 `TryGetValue`로 읽고, 없으면 기본 키로 폴백합니다.',
    LoadingSceneManager: '정적 `nextSceneName`에 목표 씬을 저장하고 **"0.5_Loading" 씬으로 먼저 이동**합니다. 그 씬의 `Start`에서 `LoadSceneAsync`를 시작하고 `allowSceneActivation = false`로 90%에서 멈춰 둡니다. `op.progress / 0.9`를 Slider와 TMP 텍스트에 반영하고, 90% 이후에는 `fadeOrMinDelay` 동안 `Mathf.Lerp`로 게이지를 1까지 채운 뒤에야 씬 활성화를 허용합니다. 로딩이 너무 빨라 화면이 튀는 것을 막는 연출 장치입니다. `nextSceneName`이 비어 있으면 LogError 후 return합니다.',
    PlayerData: '`ScriptableObject` 데이터 컨테이너입니다. `CreateAssetMenu`로 Project 창에서 `.asset` 파일을 만들 수 있습니다. 이름·ID·체력·속도·아이콘·애니메이션 스프라이트·설명을 담고, `PlayerMove`가 `SelectScene.SelectedData`를 통해 이 값을 읽습니다. `chddkf`는 `GameObject` 필드인데 이름이 오타로 보이고 코드 어디에서도 참조되지 않습니다.',
    PlayerMove: '`SelectScene.SelectedData`(외부 정적 참조)에서 `playerSpeed`를 읽어 `speed = playerSpeed * 5`로 만들고, `playerIcon`을 `SpriteRenderer.sprite`에 적용합니다. `Update`에서는 키보드(`KeyManager`의 바인딩, 기본 WASD)와 게임패드 스틱·DPad를 합산해 방향을 만들고, 대각선일 때 정규화한 뒤 이동합니다. 마지막에 카메라 뷰포트 좌표로 위치를 Clamp해 화면 밖으로 나가지 못하게 합니다. **선택 데이터가 없으면 `speed = 0`이라 캐릭터가 움직이지 않습니다** — 기본 속도 폴백이 필요합니다.',
    PlayerShooting: '매 프레임 `KeyManager`에서 Attack/Ultimate 키를 조회하고(없으면 Z/X) 공격을 처리합니다. 기본 공격은 `isPressed` + `nextFireTime` 쿨다운으로 연사하고, 필살기는 `wasPressedThisFrame`으로 단발 발사합니다. 스폰 위치는 `firePoint`가 있으면 그곳, 없으면 자기 위치입니다. `homingbulletPrefab`이 비어 있으면 일반 총알로 대체하고 경고를 남기는 방어 코드가 들어 있습니다.',
    TmiReader: '`tmiText` 배열에서 `Random.Range(0, Length)`로 한 항목을 골라 TMP에 `TMI : ...` 형식으로 출력합니다. 배열이 비어 있으면 `Random.Range(0, 0)`이 0을 반환해 `[0]` 접근에서 **IndexOutOfRangeException**이 납니다. `Start`에서 한 번만 실행되므로 씬마다 한 줄이 랜덤으로 보입니다.',
    TmiText: 'TMI 한 줄을 담는 `ScriptableObject`입니다. 다만 `CreateAssetMenu`의 `fileName`이 **"PlayerData"로 PlayerData와 중복**입니다. 에셋을 만들 때 파일명이 겹치므로 `TmiData` 등으로 바꾸는 편이 안전합니다.'
  };

  const state = { data: null, sources: [], selected: null, tab: 'overview', varSel: null, varScope: 'class', q: '', vq: '' };

  /* ---------- helpers ---------- */
  function primaryRole(t) { return (t.roles && t.roles[0]) || { name: t.kind, tone: 'plain', evidence: [] }; }
  function readCount(f) { return f.usages.filter(u => u.rw !== 'write').length; }
  function writeCount(f) { return f.usages.filter(u => u.rw !== 'read').length; }
  function getType(name) { return state.data.byName.get(name); }
  function selType() { return state.selected ? getType(state.selected) : null; }
  function allVars() {
    const out = [];
    state.data.types.forEach(t => {
      t.fields.forEach(f => out.push({ key: t.name + '.' + f.name, owner: t, v: f, kind: 'field' }));
      t.props.forEach(p => out.push({ key: t.name + '.' + p.name, owner: t, v: p, kind: 'property' }));
    });
    return out;
  }
  function findVar(key) { return allVars().find(x => x.key === key) || null; }
  function ensureVar() {
    const t = selType();
    if (!t) { state.varSel = null; return; }
    if (state.varSel) {
      const f = findVar(state.varSel);
      if (f && (state.varScope === 'all' || f.owner.name === t.name)) return;
    }
    const first = t.fields[0] || t.props[0];
    state.varSel = first ? t.name + '.' + first.name : null;
  }
  function allIssues() {
    const out = [];
    state.data.types.forEach(t => t.issues.forEach(i => out.push(Object.assign({ type: t.name, file: t.file }, i))));
    const rank = { high: 0, medium: 1, low: 2 };
    return out.sort((a, b) => rank[a.sev] - rank[b.sev]);
  }
  function sigOf(t) {
    const mods = t.modifiers.length ? t.modifiers.join(' ') + ' ' : '';
    const bases = t.bases.length ? ' : ' + t.bases.join(', ') : '';
    return esc(mods) + '<span class="kw">' + esc(t.kind) + '</span> <span class="nm">' + esc(t.name) + '</span>' + esc(bases);
  }
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('on'), 2400);
  }

  /* ---------- boot ---------- */
  function boot() {
    const raw = JSON.parse($('#samples').textContent);
    state.sources = raw.sources.slice();
    if (window.__START_TAB__) state.tab = window.__START_TAB__;
    if (window.__START_TYPE__) state.selected = window.__START_TYPE__;
    const hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (hash) {
      const parts = hash.split('/');
      if (['overview', 'class', 'vars', 'graph', 'source'].includes(parts[0])) state.tab = parts[0];
      if (parts[1]) state.selected = parts[1];
    }
    reanalyze();
    bindChrome();
    window.__exportMd = buildMd;
    window.addEventListener('hashchange', () => {
      const h = decodeURIComponent((location.hash || '').replace(/^#/, '')).split('/');
      if (h[1] && state.data.byName.has(h[1]) && h[1] !== state.selected) selectType(h[1]);
      if (h[0] && h[0] !== state.tab) setTab(h[0]);
    });
  }
  function syncHash() {
    try { history.replaceState(null, '', '#' + state.tab + '/' + (state.selected || '')); } catch (e) {}
  }
  function reanalyze() {
    state.data = CORE.analyzeSources(state.sources);
    if (!state.selected || !state.data.byName.has(state.selected)) {
      state.selected = state.data.types.length ? state.data.types[0].name : null;
    }
    ensureVar();
    renderAll();
  }
  function renderAll() {
    renderMeta();
    renderRail();
    renderOverview();
    renderClass();
    renderVars();
    renderGraph();
    renderSource();
    setTab(state.tab, true);
    window.__UL = { data: state.data, state };
  }

  function bindChrome() {
    $('#tabs').addEventListener('click', e => {
      const b = e.target.closest('button[data-tab]');
      if (b) setTab(b.dataset.tab);
    });
    $('#search').addEventListener('input', e => { state.q = e.target.value.toLowerCase(); renderRail(); });
    $('#btnExport').addEventListener('click', exportMd);
    $('#btnAdd').addEventListener('click', () => { $('#modal').hidden = false; $('#codeInput').focus(); });
    $('#mClose').addEventListener('click', () => { $('#modal').hidden = true; });
    $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });
    $('#mRun').addEventListener('click', () => {
      const code = $('#codeInput').value;
      if (!code.trim()) { toast('코드를 붙여넣어 주세요.'); return; }
      let name = ($('#nameInput').value || '').trim();
      if (!name) name = guessName(code);
      state.sources.push({ name, code });
      $('#modal').hidden = true; $('#codeInput').value = ''; $('#nameInput').value = '';
      reanalyze();
      toast(name + ' 분석 완료');
    });
    $('#mFile').addEventListener('change', e => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      let left = files.length;
      files.forEach(f => {
        const r = new FileReader();
        r.onload = () => {
          state.sources.push({ name: f.name, code: String(r.result || '') });
          if (--left === 0) { $('#modal').hidden = true; reanalyze(); toast(files.length + '개 파일 추가'); }
        };
        r.readAsText(f);
      });
      e.target.value = '';
    });
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-type]');
      if (t) { selectType(t.dataset.type); return; }
      const v = e.target.closest('[data-var]');
      if (v) { state.varSel = v.dataset.var; state.varScope = v.dataset.scope || state.varScope; renderVars(); return; }

      if (j) { selectType(j.dataset.goto); return; }

      if (e.key === 'Escape') $('#modal').hidden = true;
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); $('#search').focus(); }
    });
  }
  function guessName(code) {
    const m = code.match(/\b(?:class|struct|interface|enum)\s+([A-Za-z_][A-Za-z0-9_]*)/);

  }
  function setTab(tab, silent) {
    state.tab = tab;
    $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

  }
  function selectType(name, tab) {
    if (!state.data.byName.has(name)) return;

    ensureVar();
    renderMeta(); renderRail(); renderClass(); renderVars(); renderSource(); renderGraph();
    syncHash();
    if (tab) setTab(tab);
  }

  /* ---------- chrome ---------- */
  function renderMeta() {
    const d = state.data;
    const comps = d.types.filter(t => t.base === 'MonoBehaviour' || (t.base && d.byName.has(t.base))).length;
    const assets = d.types.filter(t => t.base === 'ScriptableObject').length;
    const tracked = allVars().filter(x => x.v.usages.length).length;
    $('#headerMeta').innerHTML =
      '<div class="hm"><b>' + d.files.length + '</b><span>scripts</span></div>' +
      '<div class="hm"><b>' + d.types.length + '</b><span>types</span></div>' +
      '<div class="hm"><b>' + tracked + '</b><span>vars traced</span></div>' +
      '<div class="hm"><b>' + allIssues().length + '</b><span>findings</span></div>';

    const foot = $('.rail-foot');
    if (foot) foot.innerHTML = '<span class="dot"></span>규칙 기반 정적 분석 · 브라우저에서만 실행';
  }

  function renderRail() {
    const q = state.q;

    }
